name: Validate data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'src/schema.json'
      - 'scripts/validate.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate map data
        run: node scripts/validate.mjs
