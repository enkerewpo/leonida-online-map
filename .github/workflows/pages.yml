name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate map data
        run: npm run validate
      - name: Fetch the in-game map tiles (GTADB, CC BY 4.0)
        uses: actions/checkout@v4
        with:
          repository: rolux/gtadb.org
          path: gtadb
          sparse-checkout: maps/tiles/6/day
          sparse-checkout-cone-mode: true
      - name: Lay out the in-game map tiles
        run: npm run tiles -- gtadb/maps/tiles/6/day
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vectorise the in-game map's most detailed level
        run: |
          pip install -q opencv-python-headless shapely numpy
          python tools/vectorize.py gtadb/maps/tiles/6/day
      - name: Cache tippecanoe
        id: tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-2.79.0-${{ runner.os }}
      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" tippecanoe
          mkdir -p ~/.local/bin && cp /tmp/tippecanoe/tippecanoe ~/.local/bin/
      - name: Vector tiles
        run: PATH="$HOME/.local/bin:$PATH" npm run vector
      - name: Build
        run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
