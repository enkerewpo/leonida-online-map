<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leonida Online Map — cover</title>
<style>
  @font-face { font-family: Barlow Condensed; font-weight: 700; src: url(../fonts/BarlowCondensed-Bold.ttf); }
  @font-face { font-family: Barlow Condensed; font-weight: 600; src: url(../fonts/BarlowCondensed-SemiBold.ttf); }
  html, body { margin: 0; background: #000; }
  .card { position: relative; width: 1600px; height: 900px; overflow: hidden; background: url(map-vice.jpg) 60% 45% / cover no-repeat; }
  /* Darken only the corner the type sits on. */
  .card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(20deg, rgba(10, 10, 24, 0.82) 0%, rgba(10, 10, 24, 0.35) 38%, rgba(10, 10, 24, 0) 60%); }
  .title { position: absolute; left: 72px; bottom: 64px; color: #fff; font-family: 'Barlow Condensed'; text-transform: uppercase; }
  h1 { margin: 0; font-weight: 700; font-size: 168px; line-height: 0.86; letter-spacing: 0.01em; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.55); }
  .url { margin-top: 22px; font-weight: 600; font-size: 34px; letter-spacing: 0.04em; color: #ff8fc0; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); }
  .credit { position: absolute; right: 28px; bottom: 22px; font: 600 15px/1 'Barlow Condensed'; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255, 255, 255, 0.75); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
  <div class="card">
    <div class="title">
      <h1>Leonida<br>Online Map</h1>
      <div class="url">enkerewpo.github.io/leonida-online-map</div>
    </div>
    <div class="credit">Fan-made, not affiliated with Rockstar Games · Map tiles: GTADB.ORG (CC BY 4.0)</div>
  </div>
</body>
</html>
